[project]
name = "buyer-universe-generator"
version = "0.1.0"
description = "Runnable foundation for a public-data buyer universe long-list generator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=3.0,<4.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pytz>=2024.1",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
bug = "src.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
