version: 5

# Providers define availability and provider-specific retrieval knobs only.
providers:
  edgar:
    provider: edgartools
    enabled: true
    required: true
    cache_ttl_hours: 24
    retrieval:
      markdown_item_parser_enabled: true
      markdown_item_parser_min_chars: 500

  polygon:
    provider: polygon.io
    enabled: true
    required: false
    api_key_env: BUG_POLYGON_API_KEY
    cache_ttl_hours: 24

  fmp:
    provider: financialmodelingprep.com
    enabled: true
    required: false
    api_key_env: BUG_FMP_API_KEY
    cache_ttl_hours: 24

  company_pages:
    provider: official_investor_relations_pages
    enabled: true
    required: false
    cache_ttl_hours: 24

  newsapi:
    provider: newsapi.org
    enabled: true
    required: false
    api_key_env: BUG_NEWS_API_KEY
    cache_ttl_hours: 12
    retrieval:
      # NewsAPI Developer keys only support a short historical search window. Increase this for paid plans.
      max_lookback_days: 30
      domains:
        - bloomberg.com
        - reuters.com
        - wsj.com
        - ft.com
        - cnbc.com
        - barrons.com
        - marketwatch.com
        - seekingalpha.com
        - benzinga.com
        - thedeal.com
        - businessinsider.com
        - techcrunch.com
        - thestreet.com
        - nasdaq.com
        - yahoo.com

  google_news_rss:
    provider: google_news_rss
    enabled: true
    required: false
    cache_ttl_hours: 6
    retrieval:
      rss_language: en-US
      rss_country: US
      rss_edition: US:en

  llm_web_search:
    provider: openrouter.ai
    enabled: true
    required: false
    api_key_env: BUG_OPENROUTER_API_KEY
    cache_ttl_hours: 0
    retrieval:
      web_search_max_results: 10
      web_search_max_total_results: 40
      web_search_engine: auto
      web_search_context_size: low
      web_fetch_max_uses: 5
      web_fetch_max_content_tokens: 12000

stages:
  target_profile_builder:
    use_cases:
      target_identity:
        - source_id: edgar
          dimension: seller_profile.identity_resolution
          source_strength: A

      sec_filing_metadata:
        - source_id: edgar
          dimension: seller_profile.filing_metadata
          source_strength: A

      exchange_profile:
        - source_id: polygon
          dimension: seller_profile.exchange_profile
          source_strength: B

      business_description:
        - source_id: edgar
          dimension: seller_profile.business_description
          source_strength: B
        - source_id: company_pages
          dimension: seller_profile.business_description
          source_strength: B

      company_strategy:
        - source_id: edgar
          dimension: seller_profile.company_strategy
          source_strength: B

      recent_news_context:
        - source_id: newsapi
          dimension: seller_profile.recent_news_context
          source_strength: B

    retrievers:
      TargetProfileExtractor:
        use_case: business_description
        business_description_forms:
          - 10-K
          - 10-Q
        business_description_text_scope: business_description
        company_strategy_forms:
          - 10-K
          - 8-K
          - S-1
          - S-1/A
          - 10-Q
        company_strategy_text_scope: company_strategy
        llm_max_attempts: 2
        llm_max_input_chars: 120000
        size_metric_keys:
          - market_cap
          - weighted_shares_outstanding
          - share_class_shares_outstanding
          - total_employees
          - employee_count

  potential_buyer_recaller:
    use_cases:
      public_company_peer_discovery:
        - source_id: edgar
          dimension: potential_buyer_discovery.public_company_peer_discovery
          source_strength: B
          role: public_company_metadata

      strategic_acquisition_intent:
        - source_id: llm_web_search
          dimension: potential_buyer_discovery.strategic_acquisition_intent
          source_strength: C
          role: llm_web_search_source
          priority: 1

      strategic_transaction_activity:
        - source_id: edgar
          dimension: potential_buyer_discovery.transaction_signal
          source_strength: C
          role: primary_filing_source
          priority: 1
        - source_id: newsapi
          dimension: potential_buyer_discovery.transaction_news
          source_strength: B
          role: supplemental_news_source
          priority: 2
        - source_id: google_news_rss
          dimension: potential_buyer_discovery.transaction_news
          source_strength: C
          role: supplemental_rss_news_source
          priority: 3

      financial_sponsor_activity:
        - source_id: fmp
          dimension: potential_buyer_discovery.financial_sponsor_activity
          source_strength: B
          role: deal_activity_source
          priority: 1
        - source_id: llm_web_search
          dimension: potential_buyer_discovery.financial_sponsor_activity
          source_strength: C
          role: llm_web_search_source
          priority: 2

    retrievers:
      SameSicRetriever:
        use_case: public_company_peer_discovery
        max_candidates: 150

      MAHistoryRetriever:
        use_case: strategic_transaction_activity
        lookback_years: 5
        max_companies: 150
        max_documents: 50
        max_queries: 10
        page_size: 10
        edgar_form_type: 8-K
        # SEC 8-K Item 2.01 is the primary completed-acquisition signal. Item 1.01 is retained only as support.
        edgar_primary_items:
          - "2.01"
        edgar_supporting_items:
          - "1.01"
        require_edgar_primary_item: true
        fetch_edgar_filing_text: true
        edgar_text_scope: primary_item_section
        rss_topic: BUSINESS
        rss_require_identity_resolution: false
        rss_use_llm_extraction: true
        rss_require_llm_extraction: true
        eligible_sector_matches:
          - same
          - adjacent
        transaction_terms:
          - acquisition
          - acquired
          - acquires
          - buys
          - bought
          - merger
          - add-on

      StrategicAcquisitionIntentRetriever:
        use_case: strategic_acquisition_intent
        lookback_years: 1
        max_candidates: 25
        max_documents: 60
        max_queries: 8
        max_evidence_per_candidate: 2
        min_candidates_before_retry: 5
        max_web_search_attempts: 2
        eligible_sector_matches:
          - same
          - adjacent
        transaction_terms:
          - acquisition
          - acquisitions
          - acquired
          - acquire
          - "M&A"
          - mergers and acquisitions
          - corporate development
          - strategic acquisitions
          - bolt-on
          - roll-up

      PEDealActivityRetriever:
        use_case: financial_sponsor_activity
        lookback_years: 5
        max_documents: 100
        max_queries: 5
        page_size: 20
        max_candidates: 100
        # Bound PE sponsor web-search spend by scanning the ordered seed universe in small batches.
        max_companies: 30
        web_search_batch_size: 10
        eligible_sector_matches:
          - same
          - adjacent
        transaction_terms:
          - acquisition
          - acquired
          - acquires
          - buyout
          - add-on
          - investment
          - recapitalization
