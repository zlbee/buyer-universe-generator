version: 3

# Providers define availability and provider-specific retrieval knobs only.
providers:
  edgar:
    provider: edgartools
    enabled: true
    required: true
    cache_ttl_hours: 24
    retrieval:
      markdown_item_parser_enabled: true
      markdown_item_parser_min_chars: 500

  polygon:
    provider: polygon.io
    enabled: true
    required: false
    api_key_env: BUG_POLYGON_API_KEY
    cache_ttl_hours: 24

  fmp:
    provider: financialmodelingprep.com
    enabled: true
    required: false
    api_key_env: BUG_FMP_API_KEY
    cache_ttl_hours: 24

  company_pages:
    provider: official_investor_relations_pages
    enabled: true
    required: false
    cache_ttl_hours: 24

  newsapi:
    provider: newsapi.org
    enabled: true
    required: false
    api_key_env: BUG_NEWS_API_KEY
    cache_ttl_hours: 12
    retrieval:
      # NewsAPI Developer keys only support a short historical search window. Increase this for paid plans.
      max_lookback_days: 30
      domains:
        - bloomberg.com
        - reuters.com
        - wsj.com
        - ft.com
        - cnbc.com
        - barrons.com
        - marketwatch.com
        - seekingalpha.com
        - benzinga.com
        - thedeal.com
        - businessinsider.com
        - techcrunch.com
        - thestreet.com
        - nasdaq.com
        - yahoo.com

  google_news_rss:
    provider: google_news_rss
    enabled: true
    required: false
    cache_ttl_hours: 6
    retrieval:
      rss_language: en-US
      rss_country: US
      rss_edition: US:en

  llm_web_search:
    provider: openrouter.ai
    enabled: true
    required: false
    api_key_env: BUG_OPENROUTER_API_KEY
    cache_ttl_hours: 0
    retrieval:
      web_search_max_results: 25
      web_search_max_total_results: 100
      web_search_engine: auto
      web_search_context_size: low
      web_fetch_max_uses: 20
      web_fetch_max_content_tokens: 50000

# Evidence profiles are the runtime evidence-strength policy for each provider/dimension pair.
evidence_profiles:
  edgar:
    seller_profile.identity_resolution:
      source_strength: A
    seller_profile.filing_metadata:
      source_strength: A
    seller_profile.business_description:
      source_strength: B
    seller_profile.company_strategy:
      source_strength: B
    buyer_long_list_recall.public_company_peer_discovery:
      source_strength: B
    buyer_long_list_recall.transaction_signal:
      source_strength: C

  polygon:
    seller_profile.exchange_profile:
      source_strength: B

  company_pages:
    seller_profile.business_description:
      source_strength: B

  newsapi:
    seller_profile.recent_news_context:
      source_strength: B
    buyer_long_list_recall.transaction_news:
      source_strength: B

  google_news_rss:
    buyer_long_list_recall.transaction_news:
      source_strength: C

  fmp:
    buyer_long_list_recall.financial_sponsor_activity:
      source_strength: B

  llm_web_search:
    buyer_long_list_recall.financial_sponsor_activity:
      source_strength: C
    buyer_long_list_recall.strategic_acquisition_intent:
      source_strength: C

stages:
  target_profile_builder:
    use_cases:
      target_resolution:
        - source_id: edgar
          dimension: seller_profile.identity_resolution

      sec_filings:
        - source_id: edgar
          dimension: seller_profile.filing_metadata

      exchange_profile:
        - source_id: polygon
          dimension: seller_profile.exchange_profile

      seller_profile_business_description:
        - source_id: edgar
          dimension: seller_profile.business_description
        - source_id: company_pages
          dimension: seller_profile.business_description

      seller_profile_company_strategy:
        - source_id: edgar
          dimension: seller_profile.company_strategy

      news_discovery:
        - source_id: newsapi
          dimension: seller_profile.recent_news_context

  potential_buyer_recaller:
    use_cases:
      buyer_recall_strategic_public_companies:
        - source_id: edgar
          dimension: buyer_long_list_recall.public_company_peer_discovery

      buyer_recall_strategic_intent:
        - source_id: llm_web_search
          dimension: buyer_long_list_recall.strategic_acquisition_intent

      buyer_recall_transaction_signals:
        - source_id: edgar
          dimension: buyer_long_list_recall.transaction_signal
        - source_id: newsapi
          dimension: buyer_long_list_recall.transaction_news
        - source_id: google_news_rss
          dimension: buyer_long_list_recall.transaction_news

      buyer_recall_financial_sponsors:
        - source_id: fmp
          dimension: buyer_long_list_recall.financial_sponsor_activity
        - source_id: llm_web_search
          dimension: buyer_long_list_recall.financial_sponsor_activity

    retrievers:
      SameSicRetriever:
        use_case: buyer_recall_strategic_public_companies
        source_roles:
          public_company_metadata: edgar
        max_candidates: 150

      MAHistoryRetriever:
        use_case: buyer_recall_transaction_signals
        source_roles:
          primary_filing_source: edgar
          supplemental_news_source: newsapi
          supplemental_rss_news_source: google_news_rss
        source_priority:
          - edgar
          - newsapi
          - google_news_rss
        lookback_years: 5
        max_companies: 150
        max_documents: 50
        max_queries: 10
        page_size: 10
        edgar_form_type: 8-K
        # SEC 8-K Item 2.01 is the primary completed-acquisition signal. Item 1.01 is retained only as support.
        edgar_primary_items:
          - "2.01"
        edgar_supporting_items:
          - "1.01"
        require_edgar_primary_item: true
        fetch_edgar_filing_text: true
        edgar_text_scope: primary_item_section
        rss_topic: BUSINESS
        rss_require_identity_resolution: false
        rss_use_llm_extraction: true
        rss_require_llm_extraction: true
        eligible_sector_matches:
          - same
          - adjacent
        transaction_terms:
          - acquisition
          - acquired
          - acquires
          - buys
          - bought
          - merger
          - add-on

      StrategicAcquisitionIntentRetriever:
        use_case: buyer_recall_strategic_intent
        source_roles:
          llm_web_search_source: llm_web_search
        source_priority:
          - llm_web_search
        lookback_years: 1
        max_candidates: 25
        max_documents: 60
        max_queries: 8
        max_evidence_per_candidate: 2
        eligible_sector_matches:
          - same
          - adjacent
        transaction_terms:
          - acquisition
          - acquisitions
          - acquired
          - acquire
          - "M&A"
          - mergers and acquisitions
          - corporate development
          - strategic acquisitions
          - bolt-on
          - roll-up

      PEDealActivityRetriever:
        use_case: buyer_recall_financial_sponsors
        source_roles:
          deal_activity_source: fmp
          llm_web_search_source: llm_web_search
        source_priority:
          - fmp
          - llm_web_search
        lookback_years: 5
        max_documents: 100
        max_queries: 5
        page_size: 20
        max_candidates: 100
        eligible_sector_matches:
          - same
          - adjacent
        transaction_terms:
          - acquisition
          - acquired
          - acquires
          - buyout
          - add-on
          - investment
          - recapitalization
