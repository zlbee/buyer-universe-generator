version: 2

# Source-level settings describe provider availability and operational behavior only.
# Evidence strength and field coverage are intentionally scoped by dimension below.
sources:
  edgar:
    provider: edgartools
    enabled: true
    required: true
    cache_ttl_hours: 24
    retrieval:
      markdown_item_parser_enabled: true
      markdown_item_parser_min_chars: 500
    dimensions:
      seller_profile.identity_resolution:
        source_strength: A
        field_coverage:
          - identity
          - cik
          - ticker
          - exchange
          - sic
        rationale: SEC registrant metadata is the authoritative anchor for US-listed targets.

      seller_profile.filing_metadata:
        source_strength: A
        field_coverage:
          - latest_10k
          - latest_10q
          - recent_8k
          - accession_number
          - filing_date
          - report_period
        rationale: SEC filing metadata is primary evidence for public-company source tracing.

      seller_profile.business_description:
        source_strength: B
        field_coverage:
          - business_overview
          - risk_factors
          - operating_segments
          - geographic_disclosures
        rationale: SEC filings are reliable but require extraction from unstructured filing text.

      seller_profile.company_strategy:
        source_strength: B
        field_coverage:
          - mdna_strategy_discussion
          - strategic_priorities
          - material_transactions
          - acquisitions
          - ipo_strategy
        rationale: SEC 10-K MD&A, 8-K material event filings, and S-1 registration statements can provide traceable strategy evidence from primary disclosures.

      buyer_long_list_recall.public_company_peer_discovery:
        source_strength: B
        field_coverage:
          - sic
          - public_company_universe
          - filing_mentions
          - industry_context
        rationale: EDGAR can support public-company peer recall, but it is not optimized as a screening database.

      buyer_long_list_recall.transaction_signal:
        source_strength: C
        field_coverage:
          - acquisition_disclosures
          - material_event_filings
          - 8k_transaction_mentions
        rationale: EDGAR contains transaction evidence, but recall depends on disclosure language and filing timing.

  polygon:
    provider: polygon.io
    enabled: true
    required: false
    api_key_env: BUG_POLYGON_API_KEY
    cache_ttl_hours: 24
    dimensions:
      seller_profile.exchange_profile:
        source_strength: B
        field_coverage:
          - active_status
          - primary_exchange
          - cik
          - sic
          - homepage_url
        rationale: Polygon is useful for exchange metadata cross-checks but remains supporting evidence behind EDGAR.

      seller_profile.size_metrics:
        source_strength: B
        field_coverage:
          - market_cap
          - employee_count
          - shares_outstanding
        rationale: Market and size fields are useful for profile enrichment and downstream size-fit filtering.

      seller_profile.business_description:
        source_strength: C
        field_coverage:
          - company_description
          - homepage_url
        rationale: Vendor descriptions are convenient but should be cross-checked against primary disclosures.

      buyer_long_list_recall.public_company_screening:
        source_strength: B
        field_coverage:
          - active_status
          - market_cap
          - exchange
          - sic
        rationale: Polygon can help screen listed strategic buyers by liquidity, size, and public-market metadata.

      buyer_long_list_recall.strategic_adjacency:
        source_strength: C
        field_coverage:
          - company_description
          - sic
          - homepage_url
        rationale: Descriptions and SIC codes can seed adjacency, but they are too coarse for final fit claims.

  fmp:
    provider: financialmodelingprep.com
    enabled: true
    required: false
    api_key_env: BUG_FMP_API_KEY
    cache_ttl_hours: 24
    dimensions:
      seller_profile.identity_resolution:
        source_strength: B
        field_coverage:
          - identity
          - cik
          - ticker
          - exchange
        rationale: FMP search endpoints can provide supplemental public-company identity matches, but SEC remains the canonical resolver.

      seller_profile.exchange_profile:
        source_strength: B
        field_coverage:
          - symbol
          - exchange
          - price
          - beta
          - industry
          - sector
        rationale: FMP company profile data is useful for public-market metadata enrichment and cross-checking.

      seller_profile.size_metrics:
        source_strength: B
        field_coverage:
          - market_cap
          - price
          - shares_outstanding
        rationale: FMP profile and market-data endpoints can supplement downstream financial-capacity screening.

      seller_profile.business_description:
        source_strength: C
        field_coverage:
          - company_description
          - industry
          - sector
          - website
        rationale: Vendor company descriptions can seed extraction but should be cross-checked against primary disclosures.

      buyer_long_list_recall.public_company_screening:
        source_strength: B
        field_coverage:
          - public_company_universe
          - market_cap
          - sector
          - industry
          - exchange
        rationale: FMP screens and company profiles can broaden listed-buyer recall when SEC or Polygon coverage is thin.

      buyer_long_list_recall.transaction_signal:
        source_strength: B
        field_coverage:
          - acquiring_company
          - target_company
          - transaction_date
          - filing_links
        rationale: FMP structured M&A endpoints can supplement EDGAR and news transaction discovery, with final evidence validation deferred.

      buyer_long_list_recall.financial_sponsor_activity:
        source_strength: B
        field_coverage:
          - acquiring_company
          - target_company
          - transaction_date
          - filing_links
          - sponsor_deal_activity
        rationale: FMP structured M&A records can provide public recent-deal evidence for configured PE sponsor candidates.

  company_pages:
    provider: official_investor_relations_pages
    enabled: true
    required: false
    cache_ttl_hours: 24
    dimensions:
      seller_profile.business_description:
        source_strength: B
        field_coverage:
          - official_investor_relations_page
          - product_lines
          - customer_segments
          - channels
          - geographies
        rationale: Official investor relations pages can support product, channel, and geography extraction when discoverable and validated.

  newsapi:
    provider: newsapi.org
    enabled: true
    required: false
    api_key_env: BUG_NEWS_API_KEY
    cache_ttl_hours: 12
    retrieval:
      # NewsAPI Developer keys only support a short historical search window. Increase this for paid plans.
      max_lookback_days: 30
      domains:
        - bloomberg.com
        - reuters.com
        - wsj.com
        - ft.com
        - cnbc.com
        - barrons.com
        - marketwatch.com
        - seekingalpha.com
        - benzinga.com
        - thedeal.com
        - businessinsider.com
        - techcrunch.com
        - thestreet.com
        - nasdaq.com
        - yahoo.com
    dimensions:
      seller_profile.recent_news_context:
        source_strength: B
        field_coverage:
          - recent_articles
          - article_metadata
          - published_at
          - source_name
        rationale: Recent reputable news can contextualize the target but should not override primary facts.

      buyer_long_list_recall.transaction_news:
        source_strength: B
        field_coverage:
          - acquisition_articles
          - partnership_articles
          - corporate_development_mentions
        rationale: News discovery is strong for surfacing recent transaction leads and strategic intent signals.

      buyer_long_list_recall.strategic_partnership_signals:
        source_strength: C
        field_coverage:
          - partnership_mentions
          - product_launch_mentions
          - channel_relationship_mentions
        rationale: News can generate useful leads, but partnership language often needs later verification.

      buyer_long_list_recall.financial_sponsor_activity:
        source_strength: C
        field_coverage:
          - sponsor_mentions
          - portfolio_company_mentions
          - deal_activity_mentions
        rationale: General news has partial sponsor coverage and should be paired with dedicated sponsor data later.

  google_news_rss:
    provider: google_news_rss
    enabled: true
    required: false
    cache_ttl_hours: 6
    retrieval:
      rss_language: en-US
      rss_country: US
      rss_edition: US:en
    dimensions:
      seller_profile.recent_news_context:
        source_strength: C
        field_coverage:
          - recent_articles
          - rss_item_metadata
          - published_at
          - source_name
        rationale: Google News RSS is useful for broad supplemental discovery, but articles still need source-level verification.

      buyer_long_list_recall.transaction_news:
        source_strength: C
        field_coverage:
          - acquisition_articles
          - merger_articles
          - corporate_development_mentions
        rationale: Google News RSS can broaden transaction lead discovery when API-based news providers are unavailable.

      buyer_long_list_recall.strategic_partnership_signals:
        source_strength: C
        field_coverage:
          - partnership_mentions
          - product_launch_mentions
          - channel_relationship_mentions
        rationale: RSS search can surface supplemental strategic-signal leads, but later validation must cite the underlying publisher.

  llm_web_search:
    provider: openrouter.ai
    enabled: true
    required: false
    api_key_env: BUG_OPENROUTER_API_KEY
    cache_ttl_hours: 0
    retrieval:
      web_search_max_results: 25
      web_search_max_total_results: 100
      web_search_engine: auto
      web_search_context_size: low
      web_fetch_max_uses: 20
      web_fetch_max_content_tokens: 50000
    dimensions:
      buyer_long_list_recall.financial_sponsor_activity:
        source_strength: C
        field_coverage:
          - sponsor_mentions
          - acquired_company
          - acquisition_date
          - source_links
          - evidence_summary
        rationale: LLM web search can broaden PE sponsor deal discovery, but extracted claims remain pending verification until source pages are independently validated.

      buyer_long_list_recall.strategic_acquisition_intent:
        source_strength: C
        field_coverage:
          - strategic_acquisition_intent
          - corporate_development_mentions
          - same_or_adjacent_industry_context
          - source_links
          - evidence_summary
        rationale: LLM web search can discover strategic-buyer acquisition appetite across public web sources, but extracted claims remain pending verification until source pages are independently validated.

retrievers:
  SameSicRetriever:
    use_case: buyer_recall_strategic_public_companies
    source_roles:
      public_company_metadata: edgar
      public_company_screening: polygon
    max_candidates: 150

  MAHistoryRetriever:
    use_case: buyer_recall_transaction_signals
    source_roles:
      primary_filing_source: edgar
      supplemental_news_source: newsapi
      supplemental_rss_news_source: google_news_rss
    source_priority:
      - edgar
      - newsapi
      - google_news_rss
    lookback_years: 5
    max_companies: 5 # TODO
    max_documents: 5 # TODO
    max_queries: 1 # TODO
    page_size: 10
    edgar_form_type: 8-K
    # SEC 8-K Item 2.01 is the primary completed-acquisition signal. Item 1.01 is retained only as support.
    edgar_primary_items:
      - "2.01"
    edgar_supporting_items:
      - "1.01"
    require_edgar_primary_item: true
    fetch_edgar_filing_text: true
    edgar_text_scope: primary_item_section
    rss_topic: BUSINESS
    rss_require_identity_resolution: false
    rss_use_llm_extraction: true
    rss_require_llm_extraction: true
    eligible_sector_matches:
      - same
      - adjacent
    transaction_terms:
      - acquisition
      - acquired
      - acquires
      - buys
      - bought
      - merger
      - add-on

  StrategicAcquisitionIntentRetriever:
    use_case: buyer_recall_strategic_intent
    source_roles:
      llm_web_search_source: llm_web_search
    source_priority:
      - llm_web_search
    lookback_years: 1
    max_candidates: 25
    max_documents: 60
    max_queries: 8
    max_evidence_per_candidate: 2
    eligible_sector_matches:
      - same
      - adjacent
    transaction_terms:
      - acquisition
      - acquisitions
      - acquired
      - acquire
      - "M&A"
      - mergers and acquisitions
      - corporate development
      - strategic acquisitions
      - bolt-on
      - roll-up

  PEDealActivityRetriever:
    use_case: buyer_recall_financial_sponsors
    source_roles:
      deal_activity_source: fmp
      llm_web_search_source: llm_web_search
    source_priority:
      - fmp
      - llm_web_search
    lookback_years: 5
    max_documents: 100
    max_queries: 5
    page_size: 20
    max_candidates: 100
    eligible_sector_matches:
      - same
      - adjacent
    transaction_terms:
      - acquisition
      - acquired
      - acquires
      - buyout
      - add-on
      - investment
      - recapitalization

use_cases:
  target_resolution:
    - source_id: edgar
      dimension: seller_profile.identity_resolution
    - source_id: polygon
      dimension: seller_profile.exchange_profile
    - source_id: fmp
      dimension: seller_profile.identity_resolution

  sec_filings:
    - source_id: edgar
      dimension: seller_profile.filing_metadata

  exchange_profile:
    - source_id: polygon
      dimension: seller_profile.exchange_profile
    - source_id: fmp
      dimension: seller_profile.exchange_profile

  seller_profile_business_description:
    - source_id: edgar
      dimension: seller_profile.business_description
    - source_id: company_pages
      dimension: seller_profile.business_description
    - source_id: polygon
      dimension: seller_profile.business_description
    - source_id: fmp
      dimension: seller_profile.business_description

  seller_profile_company_strategy:
    - source_id: edgar
      dimension: seller_profile.company_strategy

  seller_profile_recent_news:
    - source_id: newsapi
      dimension: seller_profile.recent_news_context
    - source_id: google_news_rss
      dimension: seller_profile.recent_news_context

  news_discovery:
    - source_id: newsapi
      dimension: seller_profile.recent_news_context
    - source_id: google_news_rss
      dimension: seller_profile.recent_news_context

  buyer_recall_strategic_public_companies:
    - source_id: edgar
      dimension: buyer_long_list_recall.public_company_peer_discovery
    - source_id: polygon
      dimension: buyer_long_list_recall.public_company_screening
    - source_id: fmp
      dimension: buyer_long_list_recall.public_company_screening

  buyer_recall_strategic_signals:
    - source_id: polygon
      dimension: buyer_long_list_recall.strategic_adjacency
    - source_id: newsapi
      dimension: buyer_long_list_recall.strategic_partnership_signals
    - source_id: google_news_rss
      dimension: buyer_long_list_recall.strategic_partnership_signals

  buyer_recall_strategic_intent:
    - source_id: llm_web_search
      dimension: buyer_long_list_recall.strategic_acquisition_intent

  buyer_recall_transaction_signals:
    - source_id: edgar
      dimension: buyer_long_list_recall.transaction_signal
    - source_id: fmp
      dimension: buyer_long_list_recall.transaction_signal
    - source_id: newsapi
      dimension: buyer_long_list_recall.transaction_news
    - source_id: google_news_rss
      dimension: buyer_long_list_recall.transaction_news

  buyer_recall_financial_sponsors:
    - source_id: fmp
      dimension: buyer_long_list_recall.financial_sponsor_activity
    - source_id: llm_web_search
      dimension: buyer_long_list_recall.financial_sponsor_activity
    - source_id: newsapi
      dimension: buyer_long_list_recall.financial_sponsor_activity
