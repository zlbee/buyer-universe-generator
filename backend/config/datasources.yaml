version: 2

# Source-level settings describe provider availability and operational behavior only.
# Evidence strength and field coverage are intentionally scoped by dimension below.
sources:
  edgar:
    provider: edgartools
    enabled: true
    required: true
    cache_ttl_hours: 24
    dimensions:
      seller_profile.identity_resolution:
        source_strength: A
        field_coverage:
          - identity
          - cik
          - ticker
          - exchange
          - sic
        rationale: SEC registrant metadata is the authoritative anchor for US-listed targets.

      seller_profile.filing_metadata:
        source_strength: A
        field_coverage:
          - latest_10k
          - latest_10q
          - recent_8k
          - accession_number
          - filing_date
          - report_period
        rationale: SEC filing metadata is primary evidence for public-company source tracing.

      seller_profile.business_description:
        source_strength: B
        field_coverage:
          - business_overview
          - risk_factors
          - operating_segments
          - geographic_disclosures
        rationale: SEC filings are reliable but require extraction from unstructured filing text.

      buyer_long_list_recall.public_company_peer_discovery:
        source_strength: B
        field_coverage:
          - sic
          - public_company_universe
          - filing_mentions
          - industry_context
        rationale: EDGAR can support public-company peer recall, but it is not optimized as a screening database.

      buyer_long_list_recall.transaction_signal:
        source_strength: C
        field_coverage:
          - acquisition_disclosures
          - material_event_filings
          - 8k_transaction_mentions
        rationale: EDGAR contains transaction evidence, but recall depends on disclosure language and filing timing.

  polygon:
    provider: polygon.io
    enabled: true
    required: false
    api_key_env: BUG_POLYGON_API_KEY
    cache_ttl_hours: 24
    dimensions:
      seller_profile.exchange_profile:
        source_strength: B
        field_coverage:
          - active_status
          - primary_exchange
          - cik
          - sic
          - homepage_url
        rationale: Polygon is useful for exchange metadata cross-checks but remains supporting evidence behind EDGAR.

      seller_profile.size_metrics:
        source_strength: B
        field_coverage:
          - market_cap
          - employee_count
          - shares_outstanding
        rationale: Market and size fields are useful for profile enrichment and downstream size-fit filtering.

      seller_profile.business_description:
        source_strength: C
        field_coverage:
          - company_description
          - homepage_url
        rationale: Vendor descriptions are convenient but should be cross-checked against primary disclosures.

      buyer_long_list_recall.public_company_screening:
        source_strength: B
        field_coverage:
          - active_status
          - market_cap
          - exchange
          - sic
        rationale: Polygon can help screen listed strategic buyers by liquidity, size, and public-market metadata.

      buyer_long_list_recall.strategic_adjacency:
        source_strength: C
        field_coverage:
          - company_description
          - sic
          - homepage_url
        rationale: Descriptions and SIC codes can seed adjacency, but they are too coarse for final fit claims.

  newsapi:
    provider: newsapi.org
    enabled: true
    required: false
    api_key_env: BUG_NEWS_API_KEY
    cache_ttl_hours: 12
    dimensions:
      seller_profile.recent_news_context:
        source_strength: B
        field_coverage:
          - recent_articles
          - article_metadata
          - published_at
          - source_name
        rationale: Recent reputable news can contextualize the target but should not override primary facts.

      buyer_long_list_recall.transaction_news:
        source_strength: B
        field_coverage:
          - acquisition_articles
          - partnership_articles
          - corporate_development_mentions
        rationale: News discovery is strong for surfacing recent transaction leads and strategic intent signals.

      buyer_long_list_recall.strategic_partnership_signals:
        source_strength: C
        field_coverage:
          - partnership_mentions
          - product_launch_mentions
          - channel_relationship_mentions
        rationale: News can generate useful leads, but partnership language often needs later verification.

      buyer_long_list_recall.financial_sponsor_activity:
        source_strength: C
        field_coverage:
          - sponsor_mentions
          - portfolio_company_mentions
          - deal_activity_mentions
        rationale: General news has partial sponsor coverage and should be paired with dedicated sponsor data later.

use_cases:
  target_resolution:
    - source_id: edgar
      dimension: seller_profile.identity_resolution
    - source_id: polygon
      dimension: seller_profile.exchange_profile

  sec_filings:
    - source_id: edgar
      dimension: seller_profile.filing_metadata

  exchange_profile:
    - source_id: polygon
      dimension: seller_profile.exchange_profile

  seller_profile_business_description:
    - source_id: edgar
      dimension: seller_profile.business_description
    - source_id: polygon
      dimension: seller_profile.business_description

  seller_profile_recent_news:
    - source_id: newsapi
      dimension: seller_profile.recent_news_context

  news_discovery:
    - source_id: newsapi
      dimension: seller_profile.recent_news_context

  buyer_recall_strategic_public_companies:
    - source_id: edgar
      dimension: buyer_long_list_recall.public_company_peer_discovery
    - source_id: polygon
      dimension: buyer_long_list_recall.public_company_screening

  buyer_recall_strategic_signals:
    - source_id: polygon
      dimension: buyer_long_list_recall.strategic_adjacency
    - source_id: newsapi
      dimension: buyer_long_list_recall.strategic_partnership_signals

  buyer_recall_transaction_signals:
    - source_id: newsapi
      dimension: buyer_long_list_recall.transaction_news
    - source_id: edgar
      dimension: buyer_long_list_recall.transaction_signal

  buyer_recall_financial_sponsors:
    - source_id: newsapi
      dimension: buyer_long_list_recall.financial_sponsor_activity
