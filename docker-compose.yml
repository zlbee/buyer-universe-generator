services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BUG_DATABASE_URL: sqlite:////app/data/buyer_universe.db
      BUG_CACHE_DIR: /app/data/cache
      BUG_ENVIRONMENT: docker
      BUG_LOG_LEVEL: ${BUG_LOG_LEVEL:-INFO}
      BUG_SEC_USER_AGENT: buyer-universe-generator/0.1 contact@example.com
      BUG_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      EDGAR_IDENTITY: ${EDGAR_IDENTITY:-buyer-universe-generator/0.1 contact@example.com}
      BUG_OPENROUTER_API_KEY: ${BUG_OPENROUTER_API_KEY:-}
      BUG_OPENROUTER_BASE_URL: ${BUG_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      BUG_LLM_PROVIDER: ${BUG_LLM_PROVIDER:-openrouter}
      BUG_LLM_MODEL: ${BUG_LLM_MODEL:-openrouter/auto}
      BUG_LLM_TEMPERATURE: ${BUG_LLM_TEMPERATURE:-0}
      BUG_LLM_MAX_INPUT_CHARS: ${BUG_LLM_MAX_INPUT_CHARS:-24000}
      BUG_TARGET_PROFILE_EXTRACTOR_VERSION: ${BUG_TARGET_PROFILE_EXTRACTOR_VERSION:-target-profile-v1}
      BUG_TARGET_PROFILE_CACHE_TTL_HOURS: ${BUG_TARGET_PROFILE_CACHE_TTL_HOURS:-24}
      BUG_POLYGON_API_KEY: ${BUG_POLYGON_API_KEY:-}
      BUG_NEWS_API_KEY: ${BUG_NEWS_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./data:/app/data
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend-node-modules:
